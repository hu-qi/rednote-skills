name: rust-ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Python Skill distribution tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate Skill frontmatter
        run: python tools/skill_dist.py validate
      - name: VibeCoding Pet hook privacy tests
        run: node --test tests/test_vibepet_plugins.mjs
      - name: Build release
        run: cargo build --release --locked
      - name: Package and verify native Skill distribution
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) platform=windows-x86_64; binary=target/release/repodoctor.exe ;;
            macOS)   platform=macos-$(uname -m); binary=target/release/repodoctor ;;
            Linux)   platform=linux-x86_64; binary=target/release/repodoctor ;;
            *) exit 2 ;;
          esac
          archive="dist/repodoctor-v0.2.0-$platform.zip"
          python tools/skill_dist.py package --binary "$binary" --platform "$platform" --output "$archive"
          python tools/skill_dist.py verify "$archive"
          python tools/codearts_package.py "$archive" --output "dist/repodoctor-v0.2.0-$platform-codearts.zip"
          python tools/codearts_package.py "dist/repodoctor-v0.2.0-$platform-codearts.zip" --verify
      - name: Upload verified Skill package
        uses: actions/upload-artifact@v4
        with:
          name: repodoctor-v0.2.0-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Package and verify VibeCoding Pet Skill
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) platform=windows-x86_64; binary=target/release/vibepet.exe ;;
            macOS)   arch=$(uname -m); if [ "$arch" = arm64 ]; then arch=aarch64; fi; platform=macos-$arch; binary=target/release/vibepet ;;
            Linux)   platform=linux-x86_64; binary=target/release/vibepet ;;
            *) exit 2 ;;
          esac
          base="dist/vibecoding-pet-v0.1.0-$platform"
          python tools/vibepet_dist.py package --binary "$binary" --platform "$platform" --output "$base.zip"
          python tools/vibepet_dist.py package --binary "$binary" --platform "$platform" --output "$base-codearts.zip" --codearts
          python tools/vibepet_dist.py verify "$base.zip"
          python tools/vibepet_dist.py verify "$base-codearts.zip"
      - name: Upload VibeCoding Pet package
        uses: actions/upload-artifact@v4
        with:
          name: vibepet-v0.1.0-${{ runner.os }}-${{ runner.arch }}
          path: dist/vibecoding-pet-*.zip
          if-no-files-found: error
      - name: VibeCoding Pet real HTTP and CLI acceptance
        env:
          VIBEPET_BIN: ${{ github.workspace }}/target/release/vibepet${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s tests -p 'test_vibepet_http.py' -v
      - name: Validate skill using Rust CLI
        shell: bash
        run: target/release/repodoctor${{ runner.os == 'Windows' && '.exe' || '' }} validate-skill skills/repodoctor
      - name: SARIF CLI and evidence verification
        run: python -m unittest discover -s tests -p 'test_sarif_cli.py' -v
      - name: Labelled static-rule benchmark
        run: python -m unittest discover -s tests -p 'test_rule_benchmark.py' -v
      - name: RepoDoctor smoke
        shell: bash
        run: |
          target/release/repodoctor${{ runner.os == 'Windows' && '.exe' || '' }} scan . > report.json
          python -m json.tool report.json > /dev/null
