name: rust-ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Python Skill distribution tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate Skill frontmatter
        run: python3 tools/skill_dist.py validate
      - name: Build release
        run: cargo build --release
      - name: Package and verify Linux distribution
        run: |
          python3 tools/skill_dist.py package --binary target/release/repodoctor --platform linux-x86_64 --output dist/repodoctor-v0.1.0-linux-x86_64.zip
          python3 tools/skill_dist.py verify dist/repodoctor-v0.1.0-linux-x86_64.zip
      - name: RepoDoctor smoke
        run: |
          target/release/repodoctor scan . > /tmp/repodoctor.json
          python3 -m json.tool /tmp/repodoctor.json > /dev/null
