name: repodoctor-competition-submission-attempt-once
on:
  push:
    branches: [main]
    paths: [".github/workflows/repodoctor-submit-once.yml"]

permissions:
  contents: read

concurrency:
  group: repodoctor-competition-submit-once
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify successful, real CodeArts Skill invocation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://api.github.com/repos/hu-qi/rednote-skills/actions/runs/39218426522" \
            | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x["status"]=="completed" and x["conclusion"]=="success", "CodeArts Skill smoke has not passed"'
          echo 'Verified prior Agent invocation and RepoDoctor RD001 smoke.'


      - uses: dtolnay/rust-toolchain@stable

      - name: Build RepoDoctor native CLI
        run: cargo build --release --locked

      - name: Install RepoDoctor as a project CodeArts Skill
        shell: bash
        run: |
          set -euo pipefail
          skill_dir=".codeartsdoer/skills/repodoctor"
          mkdir -p "$skill_dir/bin"
          cp skills/repodoctor/SKILL.md "$skill_dir/SKILL.md"
          cp skills/repodoctor/README.md "$skill_dir/README.md"
          install -m 755 target/release/repodoctor "$skill_dir/bin/repodoctor"
          "$skill_dir/bin/repodoctor" validate-skill "$skill_dir"
          "$skill_dir/bin/repodoctor" scan . --format json --output "${RUNNER_TEMP}/repodoctor-preflight.json"
          python3 -m json.tool "${RUNNER_TEMP}/repodoctor-preflight.json" >/dev/null

      - name: Install official CodeArts CLI (no credentials in environment yet)
        shell: bash
        run: |
          set -euo pipefail
          installer="${RUNNER_TEMP}/codearts-install.sh"
          url="https://cnnorth4-cloudide-marketplace.obs.cn-north-4.myhuaweicloud.com/codearts/cli_tui/install_script/install.sh"
          curl --fail --location --show-error --silent --retry 3 --max-time 90 "$url" --output "$installer"
          test -s "$installer"
          # The source is the vendor's official OBS bucket; never run a third-party mirror.
          timeout 180 sh "$installer"
          echo "$HOME/.codeartsdoer/installers" >> "$GITHUB_PATH"

      - name: Trust disposable CI workspace for non-interactive CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tempfile

          folder = Path.home() / ".codeartsdoer" / "cli-data"
          folder.mkdir(parents=True, exist_ok=True)
          settings = folder / "settings.json"
          config = {}
          if settings.is_file():
              config = json.loads(settings.read_text(encoding="utf-8"))
              if not isinstance(config, dict):
                  raise ValueError("CodeArts settings.json must be an object")
          # Vendor FAQ's screenshot requires security.folderTrust.enabled=false.
          # Trust applies only to this disposable, reviewed-main GitHub runner.
          security = config.setdefault("security", {})
          if not isinstance(security, dict):
              raise ValueError("CodeArts security settings must be an object")
          trust = security.setdefault("folderTrust", {})
          if not isinstance(trust, dict):
              raise ValueError("CodeArts folderTrust settings must be an object")
          trust["enabled"] = False
          # A top-level "enabled" has no documented folder-trust meaning.
          config.pop("enabled", None)
          fd, temporary = tempfile.mkstemp(prefix=".ci-settings-", dir=folder)
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as stream:
                  json.dump(config, stream)
              os.chmod(temporary, 0o600)
              os.replace(temporary, settings)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          print("Configured disposable runner workspace trust; agent sandbox remains enabled.")
          PY

      - name: Check CodeArts CLI installation
        shell: bash
        run: |
          set -euo pipefail
          codearts --version
          codearts run --help >/dev/null

      - name: Attempt official two-market contest submission (verify listings separately)
        shell: bash
        env:
          CODEARTS_CLI_AK: ${{ secrets.AK }}
          CODEARTS_CLI_SK: ${{ secrets.SK }}
          PHASE: "submit"
          PRIMARY_MODEL: ${{ vars.CODEARTS_PRIMARY_MODEL || 'huaweicloud-maas/glm-5.3' }}
          FALLBACK_MODEL: ${{ vars.CODEARTS_FALLBACK_MODEL || 'Gemini-3.8-Flash-Medium' }}
          CODEARTS_CI_ALLOW_EXACT_SCANNER: "1"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/codearts-summary"
          # Check actual CLI Skill registration without printing Skill contents.
          if codearts debug skill > "${RUNNER_TEMP}/loaded-codearts-skills.txt" 2>/dev/null; then
            if grep -qi 'repodoctor' "${RUNNER_TEMP}/loaded-codearts-skills.txt"; then
              echo 'CodeArts debug skill: RepoDoctor registered'
            else
              echo 'CodeArts debug skill: RepoDoctor not recognized'
            fi
          else
            echo 'CodeArts debug skill listing unavailable'
          fi
          python3 tools/codearts_ci.py --phase "$PHASE" --primary "$PRIMARY_MODEL" --fallback "$FALLBACK_MODEL" --result "${RUNNER_TEMP}/codearts-summary/result.json" --timeout 360

      - name: Upload sanitized publication status even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repodoctor-submission-attempt-${{ github.run_id }}
          path: ${{ runner.temp }}/codearts-summary/result.json
          if-no-files-found: warn
          retention-days: 14
