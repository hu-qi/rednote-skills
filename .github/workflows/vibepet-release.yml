name: vibecoding-pet-distribution
on:
  push:
    tags:
      - 'vibepet/v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: target/release/vibepet
          - os: macos-15-intel
            platform: macos-x86_64
            binary: target/release/vibepet
          - os: macos-latest
            platform: macos-aarch64
            binary: target/release/vibepet
          - os: windows-latest
            platform: windows-x86_64
            binary: target/release/vibepet.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        shell: bash
        run: |
          cargo test --all-targets --locked
          node --test tests/test_vibepet_plugins.mjs
          python3 -m unittest discover -s tests -p 'test_vibepet_dist.py' -v
      - name: Build
        run: cargo build --release --locked --bin vibepet
      - name: Package and verify
        shell: bash
        run: |
          python3 tools/vibepet_dist.py package --binary '${{ matrix.binary }}' --platform '${{ matrix.platform }}' --output 'dist/vibecoding-pet-v0.1.0-${{ matrix.platform }}.zip'
          python3 tools/vibepet_dist.py package --binary '${{ matrix.binary }}' --platform '${{ matrix.platform }}' --output 'dist/vibecoding-pet-v0.1.0-${{ matrix.platform }}-codearts.zip' --codearts
          python3 tools/vibepet_dist.py verify 'dist/vibecoding-pet-v0.1.0-${{ matrix.platform }}.zip'
          python3 tools/vibepet_dist.py verify 'dist/vibecoding-pet-v0.1.0-${{ matrix.platform }}-codearts.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: vibepet-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/vibepet/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vibepet-*
          merge-multiple: true
          path: dist
      - name: Generate SHA256 sums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
