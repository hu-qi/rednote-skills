name: repodoctor-v0.2.0-tag-and-dispatch-once
on:
  push:
    branches: [main]
    paths: [".github/workflows/release-tag-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  release-tag:
    if: github.repository == 'hu-qi/rednote-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check RepoDoctor release version and tag nonexistence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q '^version = "0.2.0"$' Cargo.toml
          test "$(grep '^VERSION = ' tools/skill_dist.py)" = 'VERSION = "0.2.0"'
          if gh api repos/"$GITHUB_REPOSITORY"/git/ref/tags/repodoctor/v0.2.0 >/dev/null 2>&1; then
            echo 'Tag already exists, refusing to recreate or republish.'
            exit 1
          fi
      - name: Create immutable release ref and explicitly dispatch release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/"$GITHUB_REPOSITORY"/git/refs \
            -f ref='refs/tags/repodoctor/v0.2.0' -f sha="$GITHUB_SHA" >/dev/null
          # Github Actions-created tags do not trigger push workflows by default.
          # workflow_dispatch is an explicitly supported GITHUB_TOKEN exception.
          gh workflow run release.yml --ref 'repodoctor/v0.2.0'
          echo 'Created version tag and dispatched release.yml on the exact tag.'
